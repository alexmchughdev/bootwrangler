name: ubuntu-server

os:
  family: ubuntu
  version: "24.04"
  architecture: x86_64

system:
  hostname: ubuntu-server
  timezone: Europe/London
  keyboard: gb
  locale: en_GB.UTF-8

network:
  mode: dhcp
  interface: auto

disk:
  mode: wipe
  target: auto
  install_mode: server
  filesystem: ext4
  confirm_destructive: true

users:
  - name: deploy
    shell: /bin/bash
    groups:
      - sudo
    sudo: true
    ssh_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ0EkzLnXFTKfQXv2bseD0jLxoc+R6NxRHWqnY15T9i6 example-only@bootwrangler.invalid

ssh:
  enabled: true
  permit_root_login: false
  password_authentication: false

packages:
  presets:
    - minimal
    - remote-admin
  names:
    - git

services:
  enable:
    - ssh

validation:
  ssh:
    enabled: true
    user: deploy
  commands:
    - name: Check OS release
      command: cat /etc/os-release
      expect_exit_code: 0

post_install:
  scripts:
    - name: example.sh
      content: |
        echo "example post-install hook"

os_specific:
  ubuntu:
    autoinstall_version: 1
    apt_mirror: default
