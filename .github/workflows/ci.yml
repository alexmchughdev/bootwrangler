name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Attribution scan
        run: |
          found=$(grep -riE \
            "generated by|co-authored-by.*claude|co-authored-by.*copilot|co-authored-by.*chatgpt|\banthropics?\b|\bopenai\b" \
            --include="*.go" --include="*.ts" --include="*.tsx" \
            --include="*.md" --include="*.yaml" --include="*.yml" \
            . || true)
          if [ -n "$found" ]; then
            echo "Found AI attribution text:"
            echo "$found"
            exit 1
          fi

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for private keys
        run: |
          found=$(grep -rE \
            "BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY|-----BEGIN PRIVATE KEY-----" \
            --include="*.go" --include="*.ts" --include="*.tsx" \
            --include="*.yaml" --include="*.yml" --include="*.json" \
            . || true)
          if [ -n "$found" ]; then
            echo "Potential private key found:"
            echo "$found"
            exit 1
          fi
