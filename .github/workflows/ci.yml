name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Attribution scan
        run: |
          agent_kind="a""i"
          patterns=(
            "chat""gpt"
            "open""ai"
            "cod""ex"
            "anthro""pic"
            "anthro""pics"
            "${agent_kind}-generated"
            "generated by ${agent_kind}"
            "generated with ${agent_kind}"
            "${agent_kind} assisted"
            "assisted by ${agent_kind}"
            "co-authored""-by"
          )
          pattern="$(IFS='|'; echo "${patterns[*]}")"
          found=$(git grep -nIE "$pattern" -- \
            "*.go" "*.ts" "*.tsx" "*.md" "*.yaml" "*.yml" || true)
          if [ -n "$found" ]; then
            echo "Found prohibited attribution text:"
            echo "$found"
            exit 1
          fi

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for private keys
        run: |
          key_word="K""EY"
          private_key_pattern="BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE ${key_word}|-----BEGIN PRIVATE ${key_word}-----"
          found=$(git grep -nIE "$private_key_pattern" -- \
            "*.go" "*.ts" "*.tsx" "*.yaml" "*.yml" "*.json" || true)
          if [ -n "$found" ]; then
            echo "Potential private key found:"
            echo "$found"
            exit 1
          fi
